<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Expense Tracker</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" href="{{ url_for('reports') }}">Reports</a>
            <a class="nav-link active" href="{{ url_for('settings') }}">Settings</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header fw-semibold">Monthly Budget</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('settings') }}">
                        <div class="mb-3">
                            <label for="budget_amount" class="form-label">Budget Amount ($)</label>
                            <input type="number"
                                   class="form-control"
                                   id="budget_amount"
                                   name="budget_amount"
                                   step="0.01"
                                   min="0"
                                   value="{{ budget.amount if budget else '' }}"
                                   required>
                            <div class="form-text">Set your monthly spending limit. Set to 0 to hide the progress bar.</div>
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
