{% extends 'base.html' %}
{% block title %}SETTINGS — EXP_TRACKER{% endblock %}

{% block content %}

<div class="settings-col">

    <div class="section-header">MONTHLY BUDGET</div>

    <form class="inline-form" method="POST" action="{{ url_for('settings') }}">
        <input type="number"
               class="input-field"
               name="budget_amount"
               step="0.01"
               min="0"
               placeholder="0.00"
               value="{{ budget.amount if budget else '' }}"
               required>
        <button type="submit" class="btn-primary">SAVE</button>
    </form>
    <p class="field-hint">Set to 0 to disable budget tracking.</p>

    <div class="danger-zone">
        <div class="section-header danger">DANGER ZONE</div>

        <button class="btn-danger" id="clear-btn" onclick="showConfirm()">CLEAR ALL EXPENSES</button>

        <div class="confirm-area" id="confirm-area">
            <p>This will delete all expenses permanently. Are you sure?</p>
            <div class="confirm-btns">
                <form method="POST" action="{{ url_for('clear_expenses') }}" style="display:inline">
                    <button type="submit" class="btn-confirm">CONFIRM</button>
                </form>
                <button type="button" class="btn-cancel" onclick="hideConfirm()">CANCEL</button>
            </div>
        </div>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script>
    function showConfirm() {
        document.getElementById('confirm-area').style.display = 'block';
        document.getElementById('clear-btn').style.display = 'none';
    }

    function hideConfirm() {
        document.getElementById('confirm-area').style.display = 'none';
        document.getElementById('clear-btn').style.display = 'block';
    }
</script>
{% endblock %}
